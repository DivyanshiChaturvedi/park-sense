kind = "web"
previewPath = "/"
title = "Park Sense – Smart Parking System"
version = "1.0.0"
id = "artifacts/park-sense"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19555

[services.development]
run = "pnpm --filter @workspace/park-sense run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/park-sense", "run", "build" ]
publicDir = "artifacts/park-sense/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19555"
BASE_PATH = "/"
